name: دستیار · تست دود

# از ۱۶ مهر ۱۴۰۵: ورکر لبهٔ tj-assist با مورد‌های edge/assist/smoke-cases.mjs (۵۰ پرسش پرتکرار، بی‌ربط‌ها، واژه‌های ممنوع)؛
# زیر ۹۵٪ درست قرمز. درخواست‌ها با رمز لید سایت امضا می‌شوند (رمزها فقط در محیط production).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: تست
        env:
          PII_NAMES: ${{ secrets.PII_NAMES }}
          SITE_LEAD_SECRET: ${{ secrets.SITE_LEAD_SECRET }}
        run: node site/tools/assist-smoke.mjs
