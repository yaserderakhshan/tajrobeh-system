name: سایت · خواندن وضعیت زنده (pull)

# فقط خواندن از tajrobeh.life با کاربر claude-ops (secrets: WP_USER، WP_APP_PASSWORD). هیچ درخواست نوشتنی به سایت نمی‌رود.
# WP_BOT_USER و WP_BOT_APP_PASSWORD مال بات‌اند و اینجا استفاده نمی‌شوند.
# خروجی: خلاصه در همین اجرا، artifact «site-pull»، و نسخهٔ زندهٔ /site روی شاخهٔ site-sync/live (برای مقایسه و PR).
on:
  # v170.9: فقط اجرای دستی از main (رمزها فقط در Environment «production»)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-pull
  cancel-in-progress: false

jobs:
  pull:
    environment: production   # v170.9: رمزها فقط در Environment «production» (فقط main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: خواندن سایت زنده و مقایسه با مخزن
        id: pull
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OUT: ${{ runner.temp }}/site-pull
        run: node site/tools/site-pull.mjs --write

      - name: تفاوت فایل‌ها
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/site-pull"
          git add -A site
          git diff --cached --stat -- site | tail -40 | tee "$RUNNER_TEMP/site-pull/files.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-pull
          path: ${{ runner.temp }}/site-pull
          retention-days: 30

      - name: نسخهٔ زنده روی شاخهٔ site-sync/live
        if: steps.pull.outcome == 'success'
        run: |
          git config user.name "tajrobeh-site-pull"
          git config user.email "actions@users.noreply.github.com"
          git commit -qm "همگام‌سازی: وضعیت زندهٔ tajrobeh.life (${GITHUB_RUN_ID})" || { echo "تفاوتی نیست"; exit 0; }
          git push -f origin HEAD:refs/heads/site-sync/live
