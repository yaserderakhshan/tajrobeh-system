name: رویداد سبک · آزمون دیداری کشو

# ۱۸ مهر ۱۴۰۵ (J-07): کشوی جزئیات رویداد سبک روی خود tajrobeh.life/school/events/ در ۳۹۰ و ۱۲۸۰ با Playwright.
# تابع liveX و CSS «.evph» همین شاخه فقط در مرورگر آزمون جای نسخهٔ زنده می‌نشیند و یک رویداد ساختگی با سه عکس و نقل‌قول بلند
# اضافه می‌شود؛ بیرون‌زدگی، «…» و کنتراست زیر ۴٫۵ قرمزند. اسکرین‌شات‌ها در docs/site/evlite/ همین شاخه کامیت می‌شوند.
on:
  pull_request:
    paths: ['site/pages/505409-events.html', 'site/tools/evlite-visual.mjs', '.github/workflows/evlite-visual.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evlite-visual-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: آزمون روی tajrobeh.life
        env:
          OUT: docs/site/evlite
        run: node site/tools/evlite-visual.mjs
      - name: اسکرین‌شات‌ها در همین شاخه
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/site/evlite/*.png docs/site/evlite/report.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "تغییری نیست"; exit 0; fi
          git commit -m "اسکرین‌شات کشوی رویداد سبک روی tajrobeh.life (۳۹۰ و ۱۲۸۰) [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
