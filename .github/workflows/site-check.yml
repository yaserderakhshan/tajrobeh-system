name: سایت · چک PR

# روی هر PR که /site را عوض کند: نحو PHP و JSON، خط تیره، رمز در خط‌های تازه (site-check.mjs)،
# و برنامهٔ انتشار با سنجش ناهمخوانی با سایت زنده (site-deploy.mjs plan؛ فقط خواندن با claude-ops).
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: چک فایل‌ها
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node site/tools/site-check.mjs

  # ۱۴ مهر ۱۴۰۵: مقایسهٔ برنامهٔ انتشار با سایت زنده روی PR، با رمز «فقط خواندن» (Environment «site-read»، روی PRها هم در دسترس).
  # رمز نوشتن (production) فقط برای main است. continue-on-error برداشته شد: بی رمز یا اگر سایت در دسترس نبود، این بررسی قرمز است، نه سبزِ دروغین.
  live-plan:
    runs-on: ubuntu-latest
    environment: site-read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: برنامهٔ انتشار و ناهمخوانی با سایت زنده (فقط خواندن)
        env:
          BEFORE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          WP_USER: ${{ secrets.WP_READ_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_READ_APP_PASSWORD }}
        run: |
          if [ -z "$WP_USER" ] || [ -z "$WP_APP_PASSWORD" ]; then
            echo "::error::دسترسی فقط‌خواندنی (Environment «site-read»: WP_READ_USER و WP_READ_APP_PASSWORD) هنوز ساخته نشده؛ مقایسه با سایت زنده انجام نشد."
            exit 1
          fi
          node site/tools/site-deploy.mjs plan
