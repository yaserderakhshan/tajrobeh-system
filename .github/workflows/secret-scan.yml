name: چک رمز

# هر PR: خط‌های تازه نباید رمز یا توکن داشته باشند (site/tools/secret-scan.mjs). مقدارها چاپ نمی‌شوند.
on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: تست ابزار رمز
        run: node --test site/tools/test/*.test.mjs
      - name: چک خط‌های تازه
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node site/tools/secret-scan.mjs
      # v170.9: شمارهٔ تلفن، chat_id، ایمیل واقعی، کارت و شبا، شناسهٔ شیت و درایو و تقویم، نشانی Apps Script در خط‌های تازه
      - name: چک اطلاعات شخصی و شناسه‌های داخلی
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e "import('./.github/scripts/pii-scan.mjs').then(m=>{const b=m.piiSelfTest();if(b.length){console.log('::error::خودآزمایی چک اطلاعات شخصی: '+b.join('، '));process.exit(1)}})"
          node .github/scripts/pii-scan.mjs
