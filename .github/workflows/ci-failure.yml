# صندوق یکتای خطا (v170.23.5، تصمیم یاسر: «هیچ مسیر خطایی بیرون از صندوق نماند»):
# شکست هر گردش کار زمان‌دار یا دستی روی main ← تب «خطاها»ی هاب (منبع CI) از اکشن درگاه «error_report».
# بررسی‌های PR (bot-check، site-check، secret-scan) اینجا نیستند: قرمز شدنشان جلوی ادغام را می‌گیرد و خطای زنده نیست.
name: صندوق خطا · شکست گردش کار
on:
  workflow_run:
    workflows:
      - دیپلوی بات
      - سایت · انتشار
      - سایت · آینه از سایت زنده (site-mirror)
      - سایت · تست دود کمپین
      - سایت · چک هفتگی
      - سایت · اندازه‌گیری زنده (سرعت، امنیت، لید)
      - سایت · setcfg کمپین ابی
      - سایت · آزمون پل tj-ops
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: گزارش به صندوق خطا
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
        run: node .github/scripts/err-report.mjs
