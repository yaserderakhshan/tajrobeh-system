name: سایت · ورودی لکان (فلوئنت)

# E58: فید وب‌هوک فرم ثبت‌نام لکان به پل (POST /school/course-registrations/intake با سربرگ Tajrobeh-Intake-Secret).
# probe فقط می‌خواند. apply فید را می‌سازد؛ راز در خود اجرا از توکن بات ساخته و پوشانده می‌شود. test یک ورودی «آزمون TEST» می‌فرستد.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe، apply یا test'
        type: choice
        options: [probe, apply, test]
        default: probe
      form_id:
        description: 'شمارهٔ فرم فلوئنت'
        default: '19'

permissions:
  contents: read

jobs:
  lacan:
    environment: production   # رمزها فقط در Environment «production» (فقط main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: فلوئنت
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TELEGRAM_TOKEN: ${{ inputs.mode == 'apply' && secrets.TELEGRAM_TOKEN || '' }}
          MODE: ${{ inputs.mode }}
          FORM_ID: ${{ inputs.form_id }}
        run: node .github/scripts/lacan-intake.mjs
