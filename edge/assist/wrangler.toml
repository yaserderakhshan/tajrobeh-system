# ورکر دستیار تجربه. شناسهٔ KV در مخزن نیست؛ گردش کار assist-edge.yml آن را با نام «tj-assist» پیدا و جایگزین می‌کند.
name = "tj-assist"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
# route دامنهٔ سایت ندارد: tajrobeh.life روی کلادفلر نیست (۱۸ مهر ۱۴۰۵، بررسی Cowork). راه داخل ایران مسیر سرور سایت است (/wp-json/tj/v1/assist، اسنیپت 506148).

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

[triggers]
crons = ["*/30 * * * *"]
