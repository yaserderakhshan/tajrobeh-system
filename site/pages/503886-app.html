  var ALLOW = ['b', 'strong', 'i', 'em', 'u', 's', 'code', 'pre', 'br', 'a', 'blockquote', 'span'];
  function safe(html) {
    var doc = new DOMParser().parseFromString('<div>' + String(html == null ? '' : html) + '</div>', 'text/html');
    var out = document.createElement('div');
    walk(doc.body.firstChild, out);
    return out.innerHTML;
    function walk(from, to) {
      if (!from) return;
      for (var n = from.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3) { to.appendChild(document.createTextNode(n.nodeValue)); continue; }
        if (n.nodeType !== 1) continue;
        var t = n.tagName.toLowerCase();
        if (ALLOW.indexOf(t) < 0) { var sp = document.createElement('span'); walk(n, sp); to.appendChild(sp); continue; }
        var el = document.createElement(t);
        if (t === 'a') {
          var h = n.getAttribute('href') || '';
          if (/^(https?:|tg:|mailto:)/i.test(h)) { el.setAttribute('href', h); el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
        }
        walk(n, el);
        to.appendChild(el);
      }
    }
  }

  /* ─────────── تنها راه گفت‌وگو با سرور ─────────── */
  function call(api, extra) {
    var o = extra || {};
    o.api = api;
    o.initData = TG ? (TG.initData || '') : '';
    var body = JSON.stringify(o);
    /* v157: سه تلاش با مهلت؛ اتصال به گوگل از ایران گاهی دیر یا قطع می‌شود */
    function once(ms) {
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : 0;
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, signal: ctl ? ctl.signal : undefined })
        .then(function (r) { clearTimeout(timer); return r.json(); }, function (e) { clearTimeout(timer); throw e; });
    }
    function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
    return once(20000)
      .catch(function () { return wait(1200).then(function () { return once(30000); }); })
      .catch(function () { return wait(2500).then(function () { return once(40000); }); });
  }

  /* ─────────── پوستهٔ صفحه ─────────── */
  function shell(title, tag) {
    root.innerHTML =
      '<div class="bar"><button class="bk" id="tjBk" type="button" aria-label="بازگشت">→</button>' +
      '<div class="ttl">' + esc(title) + '</div>' +
      (tag ? '<div class="tag">' + esc(tag) + '</div>' : '') + '</div>' +
      '<div class="wrap fade" id="tjW"></div>';
    $('tjBk').onclick = function () { tap(); back(); };
    onScroll();
    return $('tjW');
  }
  function plain() {
    root.innerHTML = '<div class="wrap fade" id="tjW"></div>';
    return $('tjW');
  }
  function onScroll() {
    var b = root.querySelector('.bar');
    if (!b) return;
    b.classList.toggle('sticky', window.scrollY > 6);
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  function go(fn) { STACK.push(fn); paint(); }
  function back() { if (STACK.length > 1) STACK.pop(); paint(); }
  function reset(fn) { STACK = [fn]; paint(); }
  function paint() {
    var fn = STACK[STACK.length - 1];
    try { if (TG) { if (TG.BackButton) { if (STACK.length > 1) TG.BackButton.show(); else TG.BackButton.hide(); } } } catch (e) {}
    window.scrollTo(0, 0);
    fn();
  }
  try { if (TG) { if (TG.BackButton) TG.BackButton.onClick(function () { back(); }); } } catch (e) {}

  /* ─────────── حالت‌های مشترک ─────────── */
  function loading(w) { (w || root).innerHTML = '<div class="spin"></div>'; }
  function stateBox(em, title, body, actions) {
    return '<div class="state"><span class="em">' + em + '</span><b>' + esc(title) + '</b>' + esc(body) + '</div>' + (actions || '');
  }
  function emptyBox(title, body) { return stateBox('🍃', title || 'چیزی روی زمین نیست', body || 'هر وقت چیزی تازه بیاید، همین‌جا می‌بینیدش.'); }

  var ERRS = {
    auth: ['🔐', 'از داخل بات باز کنید', 'این صفحه با هویت تلگرام شما کار می‌کند. از گفت‌وگوی بات مرکز تجربه بازش کنید.'],
    cb:   ['⏳', 'این دکمه کهنه شده', 'همان کار را از منوی همین بخش دوباره شروع کنید.'],
    bad:  ['✏️', 'چیزی ناقص ماند', 'یک بار دیگر با همان اطلاعات امتحان کنید.'],
    notfound: ['🔎', 'پیدا نشد', 'شاید همین حالا جای دیگری بسته یا عوض شده باشد.'],
    run:  ['⚠️', 'کار نیمه ماند', 'یک لحظه مشکلی پیش آمد. دوباره امتحان کنید؛ اگر باز هم نشد، در گفت‌وگوی بات بنویسید.'],
    net:  ['📶', 'ارتباط برقرار نشد', 'اینترنت را بررسی کنید و دوباره بزنید.']
  };
  function errBox(r, retry) {
    var code = r ? String(r.error || '') : 'net';
    if (code === 'role') {
      var need = r.need || '';
      var mine = (r.roles || []).join('، ');
      return '<div class="state"><span class="em">🪪</span><b>این بخش برای نقش دیگری است</b>' +
        esc('این قسمت برای ' + (need ? '«' + need + '»' : 'نقش دیگری') + ' باز است.') +
        (mine ? '<div class="note">نقش‌های شما: ' + esc(mine) + '</div>' : '') +
        '</div><button class="btn ghost" id="tjHome" type="button">برگشت به خانه</button>';
    }
    var e = ERRS[code] || ERRS.run;
    return '<div class="state"><span class="em">' + e[0] + '</span><b>' + esc(e[1]) + '</b>' + esc(e[2]) +
      (r ? (r.detail ? '<div class="note">' + esc(String(r.detail).slice(0, 180)) + '</div>' : '') : '') +
      '</div>' + (retry ? '<button class="btn" id="tjRetry" type="button">دوباره</button>' : '') +
      '<button class="btn ghost" id="tjHome" type="button">برگشت به خانه</button>';
  }
  function wireErr(w, retry) {
    var h = $('tjHome'); if (h) h.onclick = function () { tap(); reset(home); };
    var rt = $('tjRetry'); if (rt) { if (retry) rt.onclick = function () { tap(); retry(); }; }
  }
  function showErr(w, r, retry) { w.innerHTML = errBox(r, !!retry); wireErr(w, retry); }

  /* ─────────── رندرکنندهٔ عمومی out ─────────── */
  /* هر آیتم out یک کارت است. inline دکمه، keys منوی بخش، edit جایگزینی کارت قبلی. */
  function renderOut(out, host, sec, opts) {
    var o = opts || {};
    var last = null;
    (out || []).forEach(function (item) {
      if (item.keys) setMenu(item.keys, sec);
      var body = safe(item.text);
      if (!body) { if (!item.photo) return; }
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        (item.photo ? '<im' + 'g class="thumb" src="' + qa(item.photo) + '" alt="">' : '') +
        '<div class="bd">' + body + '</div>';
      if (item.inline) {
        var bt = document.createElement('div');
        bt.className = 'btns';
        item.inline.forEach(function (row) {
          (row || []).forEach(function (b) {
            if (!b) return;
            if (b.url) {
              var a = document.createElement('a');
              a.className = 'ib' + ((row || []).length === 1 ? ' wide' : '');
              a.href = b.url; a.target = '_blank'; a.rel = 'noopener';
              a.textContent = b.text || 'باز کردن';
              bt.appendChild(a);
              return;
            }
            if (!b.callback_data) return;
            var el = document.createElement('button');
            el.type = 'button';
            el.className = 'ib' + ((row || []).length === 1 ? ' wide' : '');
            el.textContent = b.text || '···';
            el.onclick = function () { tap(); press(el, card, b.callback_data, sec, host, o); };
            bt.appendChild(el);
          });
        });
        if (bt.childNodes.length) card.appendChild(bt);
      }
      if (item.edit) {
        if (o.node) { o.node.parentNode.replaceChild(card, o.node); o.node = card; last = card; return; }
      }
      host.appendChild(card);
      last = card;
    });
    if (!last) {
      if (!o.quiet) {
        var e = document.createElement('div');
        e.className = 'fade';
        e.innerHTML = emptyBox('کاری انجام شد', 'بات پیام تازه‌ای برای این کار نداشت.');
        host.appendChild(e);
      }
    }
    var sb = $('tjSay');
    if (sb) {
      if (last) {
        if (/(بنویسید|بنویس|بفرستید|بفرست|تایپ کنید|وارد کنید)/.test(last.textContent || '')) sb.classList.add('open');
      }
    }
    return last;
  }

  function press(btn, card, cb, sec, host, o) {
    var all = card.querySelectorAll('button.ib');
    for (var i = 0; i < all.length; i++) all[i].disabled = true;
    btn.classList.add('on');
    call(actApi(sec, cb), { cb: cb }).then(function (r) {
      for (var i = 0; i < all.length; i++) all[i].disabled = false;
      btn.classList.remove('on');
      if (!r) return flash(host, null);
      if (!r.ok) return flash(host, r);
      buzz('success');
      renderOut(r.out, host, sec, { node: card });
      scrollEnd(host);
    })['catch'](function () {
      for (var i = 0; i < all.length; i++) all[i].disabled = false;
      btn.classList.remove('on');
      flash(host, null);
    });
  }

  function flash(host, r) {
    var d = document.createElement('div');
    d.className = 'fade';
    d.innerHTML = errBox(r, null);
    host.appendChild(d);
    wireErr(host, null);
    buzz('error');
    scrollEnd(host);
  }
  function scrollEnd(host) {
    try { host.lastChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
  }

  /* ─────────── منوی بخش، از keys خود سرور ─────────── */
  var MENU = null;
  function setMenu(keys, sec) {
    if (!MENU) return;
    var flat = [];
    (keys || []).forEach(function (row) {
      (row || []).forEach(function (k) {
        var t = (typeof k === 'string') ? k : (k ? k.text : '');
        if (t) flat.push(t);
      });
    });
    if (!flat.length) { MENU.innerHTML = ''; return; }
    if (!sayApi(sec)) { MENU.innerHTML = ''; return; }
    MENU.innerHTML = flat.map(function (t, i) {
      return '<button class="mk" type="button" data-k="' + i + '">' + esc(t) + '</button>';
    }).join('');
    MENU.querySelectorAll('[data-k]').forEach(function (b) {
      b.onclick = function () { tap(); say(sec, flat[+b.getAttribute('data-k')]); };
    });
  }

  /* ─────────── صفحهٔ بخش ─────────── */
  var SEC = { key: '', host: null };
  function section(pageKey) {
    var def = PAGES[pageKey];
    if (!def) return reset(home);
    SEC.key = pageKey;
    var w = shell(def.i + ' ' + def.t, '');
    w.innerHTML =
      '<div class="menu" id="tjMenu"></div>' +
      '<div id="tjFeed"></div>' +
      '<div class="say caps quiet" id="tjCapsBox"><div class="hd" id="tjCapsHd"><span>⋯ کارهای بیشتر</span><i>⌄</i></div>' +
      '<div class="bx"><div class="btns two" id="tjCaps"></div></div></div>' +
      (sayApi(pageKey) ? saySlot() : '');
    MENU = $('tjMenu');
    SEC.host = $('tjFeed');
    wireSay(pageKey);

    var caps = CAPS.filter(function (x) { return x.p === pageKey; });
    var cb = $('tjCaps');
    var cbox = $('tjCapsBox');
    if (!caps.length) {
      cbox.parentNode.removeChild(cbox);
    } else {
      $('tjCapsHd').onclick = function () { tap(); cbox.classList.toggle('open'); };
      if (!def.entry) cbox.classList.add('open');
      cb.innerHTML = caps.map(function (x, i) {
        return '<button class="ib wide" type="button" data-c="' + i + '">' + esc(x.l) + '</button>';
      }).join('');
      cb.querySelectorAll('[data-c]').forEach(function (b) {
        b.onclick = function () { tap(); cbox.classList.remove('open'); run(caps[+b.getAttribute('data-c')].a, {}); };
      });
    }
    if (def.entry) run(def.entry, {}, true);
  }

  /* ─────────── کش کوتاه بخش‌ها ───────────
     هر درخواست به اپس‌اسکریپت چند ثانیه می‌گیرد؛ این گریزناپذیر است.
     پس آخرین چیزی که همین آدم در همین بخش دیده بود را فوراً نشان
     می‌دهیم و تازه‌اش را پشت صحنه می‌گیریم. اگر عوض شده بود، جا
     عوض می‌کند. اگر نه، آدم اصلاً منتظر نمانده است. */
  var SEC_TTL = 10 * 60 * 1000;
  function secKey(api) { return 'tjapp.sec.' + api + '.' + (ME ? ME.chat : '0'); }
  function secRead(api) {
    try {
      var raw = localStorage.getItem(secKey(api));
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o) return null;
      if (Date.now() - (o.at || 0) > SEC_TTL) return null;
      return o.out || null;
    } catch (e) { return null; }
  }
  function secWrite(api, out) {
    try { localStorage.setItem(secKey(api), JSON.stringify({ at: Date.now(), out: out })); } catch (e) {}
  }

  /* هر بخش یک شمارنده دارد. پاسخِ درخواستی که دیگر جاری نیست دور
     ریخته می‌شود، پس دو بار زدن روی یک دکمه چیزی را قاطی نمی‌کند و
     چرخنده‌ی یتیم جا نمی‌ماند. */
  var RUNSEQ = 0;

  function spinBox(note) {
    return '<div class="spin"></div>' + (note ? '<div class="wait">' + esc(note) + '</div>' : '');
  }

  function run(api, extra, first) {
    var host = SEC.host;
    if (!host) return;
    var seq = ++RUNSEQ;
    var cached = first ? secRead(api) : null;
    var tmp = null;

    if (first) {
      if (cached) {
        host.innerHTML = '';
        renderOut(cached, host, SEC.key, {});
        var chip = document.createElement('div');
        chip.className = 'wait'; chip.id = 'tjFresh';
        chip.appendChild(document.createTextNode('در حال تازه‌کردن…'));
        host.appendChild(chip);
      } else {
        host.innerHTML = spinBox('چند لحظه؛ دارم از سرور می‌گیرم.');
      }
    } else {
      tmp = document.createElement('div');
      tmp.className = 'spin'; tmp.id = 'tjTmp' + seq;
      host.appendChild(tmp);
      scrollEnd(host);
    }

    function clear() {
      if (seq !== RUNSEQ) return false;
      if (first) host.innerHTML = '';
      else if (tmp) { if (tmp.parentNode) tmp.parentNode.removeChild(tmp); }
      return true;
    }

    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      if (seq !== RUNSEQ) return;
      if (!clear()) return;
      done = true;
      host.innerHTML = stateBox('🐢', 'سرور دیر جواب داد',
        'گاهی اپس‌اسکریپت کند می‌شود. یک بار دیگر بزنید؛ معمولاً بار دوم سریع است.',
        '<div class="btns"><button class="ib wide" type="button" id="tjRetry">دوباره امتحان کن</button></div>');
      var rb = $('tjRetry');
      if (rb) rb.onclick = function () { tap(); run(api, extra, first); };
    }, 30000);

    call(api, extra || {}).then(function (r) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (!clear()) return;
      if (!r) return flash(host, null);
      if (!r.ok) return flash(host, r);
      if (r.out) {
        if (!r.out.length) {
          host.innerHTML = emptyBox('اینجا فعلاً خالی است', 'هر وقت چیزی برای این بخش بیاید، همین‌جا می‌بینیدش.');
          if (first) secWrite(api, r.out);
          return;
        }
        renderOut(r.out, host, SEC.key, {});
        if (first) secWrite(api, r.out);
        scrollEnd(host);
        return;
      }
      /* پاسخ‌های قدیمی که out ندارند */
      legacy(host, api, r);
    })['catch'](function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (!clear()) return;
      flash(host, null);
    });
  }

  function legacy(host, api, r) {
    var d = document.createElement('div');
    d.className = 'card';
    if (api === 'ann') {
      var list = r.items || r.list || [];
      d.innerHTML = list.length
        ? '<div class="nm">اطلاعیه‌ها</div>' + list.map(function (a) {
            return '<div class="row"><b>' + esc(a.title || a.t || '') + '</b><span>' + esc(a.date || a.d || '') + '</span></div>';
          }).join('')
        : emptyBox('اطلاعیه‌ای نیست', 'تازه‌ترین اطلاعیه‌ها همین‌جا می‌آیند.');
    } else {
      d.innerHTML = '<div class="bd">' + esc('انجام شد.') + '</div>';
    }
    host.appendChild(d);
  }

  function saySlot() {
    return '<div class="say quiet" id="tjSay"><div class="hd" id="tjSayHd"><span>✍️ نوشتن پاسخ</span><i>⌄</i></div>' +
      '<div class="bx"><textarea class="tjin" id="tjSayIn" rows="3" placeholder="هر جا بات منتظر متن است، همین‌جا بنویسید."></textarea>' +
      '<button class="btn" id="tjSayGo" type="button">فرستادن</button></div></div>';
  }
  function wireSay(sec) {
    var box = $('tjSay');
    if (!box) return;
    $('tjSayHd').onclick = function () { tap(); box.classList.toggle('open'); };
    $('tjSayGo').onclick = function () {
      var v = $('tjSayIn').value.trim();
      if (!v) return;
      tap();
      $('tjSayIn').value = '';
      box.classList.remove('open');
      say(sec, v);
    };
  }
  function say(sec, text) {
    var a = sayApi(sec);
    if (!a) return;
    run(a, { text: text });
  }

  /* ─────────── خانه ─────────── */
  /* ─────────── کش محلی راه‌اندازی ───────────
     اپس‌اسکریپت برای هر درخواست کل فایل بات را می‌خواند؛ حتی یک ping
     چند ثانیه می‌گیرد. پس: خانه را فوراً از آخرین وضعیت شناخته‌شده
     می‌کشیم و پاسخ تازه را پشت صحنه می‌گیریم. آدم منتظر نمی‌ماند. */
  var LS_KEY = 'tjapp.boot.v1';
  function cacheRead() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.me || !o.me.ok) return null;
      var uid = TG ? (TG.initDataUnsafe ? (TG.initDataUnsafe.user ? TG.initDataUnsafe.user.id : 0) : 0) : 0;
      if (uid ? String(uid) !== String(o.me.chat) : false) return null;
      if (Date.now() - (o.at || 0) > 7 * 24 * 3600 * 1000) return null;
      return o;
    } catch (e) { return null; }
  }
  function cacheWrite(o) {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ at: Date.now(), me: o.me, cap: o.cap, ver: o.ver })); } catch (e) {}
  }

  /* رجیستری سرور جای جدول ثابت کلاینت را می‌گیرد. هر قابلیتی که به بات
     اضافه شود، بدون دست‌زدن به این صفحه اینجا هم پیدا می‌شود. */
  function applyCap(list) {
    if (!list || !list.length) return;
    var skip = { home: 1, book: 1, style: 1, feed: 1, mag: 1, page: 1 };
    var entries = {};
    for (var k in PAGES) if (PAGES[k].entry) entries[PAGES[k].entry] = 1;
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (!c || !c.page || !c.api) continue;
      if (skip[c.page]) continue;
      if (!PAGES[c.page]) continue;
      if (entries[c.api]) continue;
      if (/\.(say)$/.test(c.api)) continue;
      out.push({ p: c.page, a: c.api, l: c.label || c.api });
    }
    if (out.length) CAPS = out;
  }

  function applyBoot(m, fresh) {
    ME = m.me; VKF = m.vk ? 1 : 0;
    ROLE = ME.role || (ME.roles || [])[0] || 'مراجع';
    SRV_VER = m.ver || '';
    applyCap(m.cap);
    if (fresh) cacheWrite(m);
  }

  /* ─────────── v169: صف سردبیر بازبینی علمی (api: rv.list، rv.open، rv.act) ─────────── */
  function rvTok(s) { return String(s || '').split(/(\s+)/); }
  function rvDiff(a, b) {
    var x = rvTok(a), y = rvTok(b), n = x.length, m = y.length, L = [], i, j;
    for (i = 0; i <= n; i++) { L.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) { for (j = m - 1; j >= 0; j--) { L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]); } }
    var o = ''; i = 0; j = 0;
    while (i < n || j < m) {
      var same = false;
      if (i < n) { if (j < m) { same = x[i] === y[j]; } }
      if (same) { o += esc(x[i]); i++; j++; }
      else if (j < m) {

    if (cached) { applyBoot(cached, false); reset(home); STALE = true; }
    else loading(root);

    call('boot', {}).then(function (m) {
      if (!m || !m.ok) {
        if (cached) { STALE = false; freshMark(); return; }

      var same = cached ? JSON.stringify(cached.me) === JSON.stringify(m.me) : false;
      applyBoot(m, true);
