<script id="tj-team-m1-js">
(function(){
  if(!window.matchMedia||!window.matchMedia('(max-width:700px)').matches)return;
  var root=document.querySelector('.tj2.tjp');if(!root)return;
  var hero=root.querySelector('.tjp-hero');if(!hero)return;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e;}
  var pr=root.querySelector('.tjp-prose');
  if(pr){requestAnimationFrame(function(){
    if(pr.scrollHeight>250){pr.classList.add('m1-clamp');
      var b=el('button','m1-more','ادامهٔ متن');b.type='button';
      b.addEventListener('click',function(){pr.classList.remove('m1-clamp');b.remove();});
      pr.parentNode.insertBefore(b,pr.nextSibling);}
  });}
  var fl=root.querySelector('.faq-list');
  if(fl){var n=fl.querySelectorAll('details').length;
    if(n>3){fl.classList.add('m1-few');
      var fb=el('button','m1-more','پرسش‌های بیشتر');fb.type='button';
      fb.addEventListener('click',function(){fl.classList.remove('m1-few');fb.remove();});
      fl.parentNode.insertBefore(fb,fl.nextSibling);}}
  var nx=root.getAttribute('data-next-intro');
  var ct=hero.querySelector('.ctas');
  if(nx){var p=el('p','tjp-m1-next','نزدیک‌ترین وقت معارفه: ');p.appendChild(el('b','',nx));
    if(ct)ct.parentNode.insertBefore(p,ct);}
  var go=ct?ct.querySelector('a.btn-brand'):null;var h1=hero.querySelector('h1');
  if(!go||!h1||!('IntersectionObserver' in window))return;
  var bar=el('div','tjp-m1-bar');var t=el('span','t');
  t.appendChild(el('b','',h1.textContent));t.appendChild(el('small','',nx?('معارفهٔ رایگان · '+nx):'جلسهٔ معارفهٔ رایگان'));
  var a=el('a','','رزرو معارفه');a.href=go.href;a.rel='noopener';
  bar.appendChild(t);bar.appendChild(a);document.body.appendChild(bar);
  var out=false,inBook=false;
  function set(){bar.classList.toggle('on',out?!inBook:false);}
  new IntersectionObserver(function(es){out=!es[0].isIntersecting;set();},{threshold:0}).observe(go);
  var bk=root.querySelector('.tjp-book');
  if(bk)new IntersectionObserver(function(es){inBook=es[0].isIntersecting;set();},{threshold:.15}).observe(bk);
})();
</script>

<script id="tj-team-m2-js">
(function(){
  var root=document.querySelector('.tj2.tjp');if(!root)return;
  var demo=root.querySelector('.tjp-bk-demo'),go=root.querySelector('.tjp-bk-go');
  if(demo){if(go){demo.classList.add('m2-go');demo.setAttribute('role','link');demo.setAttribute('tabindex','0');
    demo.setAttribute('aria-label',go.textContent.replace(/\s+/g,' ').trim());
    var open=function(){window.open(go.href,'_blank','noopener');};
    demo.addEventListener('click',open);
    demo.addEventListener('keydown',function(e){if(e.key==='Enter')open();});}}
  var grid=root.querySelector('.tjt-grid'),tabs=root.querySelector('.tjt-f');
  if(!grid||!tabs)return;
  var cards=grid.querySelectorAll('.tjt-card'),cnt={},i,j;
  function cities(c){var em=c.querySelector('.mt em');if(!em)return [];
    var t=em.textContent.replace(/\s+/g,' ').trim();if(!t)return [];
    var p=t.split(' و '),o=[];for(var k=0;k<p.length;k++){var s=p[k].trim();if(s)o.push(s);}return o;}
  for(i=0;i<cards.length;i++){var cs=cities(cards[i]);cards[i].__c=cs;for(j=0;j<cs.length;j++){cnt[cs[j]]=(cnt[cs[j]]||0)+1;}}
  var names=[];for(var n in cnt){if(cnt[n]>=2)names.push(n);}
  if(names.length<2)return;
  names.sort(function(a,b){return cnt[b]-cnt[a];});
  var fa=function(x){return String(x).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.charAt(+d);});};
  var bar=document.createElement('div');bar.className='tjt-city';
  var lb=document.createElement('span');lb.className='lb';lb.textContent='شهر:';bar.appendChild(lb);
  var none=document.createElement('p');none.className='tjt-m2-none';none.textContent='با این دو انتخاب کسی پیدا نشد؛ یکی را بردارید.';none.hidden=true;grid.appendChild(none);
  var cur='';
  function apply(){var shown=0;
    for(var a=0;a<cards.length;a++){var ok=!cur||cards[a].__c.indexOf(cur)>-1;cards[a].classList.toggle('m2-hide',!ok);
      if(ok&&!cards[a].classList.contains('hide'))shown++;}
    grid.classList.toggle('m2-on',!!cur);none.hidden=shown>0;
    var bs=bar.querySelectorAll('button');for(var b=0;b<bs.length;b++){bs[b].classList.toggle('on',bs[b].getAttribute('data-c')===cur);}
    if(window.dataLayer){window.dataLayer.push({event:'team_city',city:cur||'all'});}}
  function mk(label,val,num){var b=document.createElement('button');b.type='button';b.setAttribute('data-c',val);b.textContent=label;
    if(num){var x=document.createElement('i');x.textContent=fa(num);b.appendChild(x);}
    b.addEventListener('click',function(){cur=val;apply();});bar.appendChild(b);}
  mk('همه','',0);for(i=0;i<names.length;i++){mk(names[i],names[i],cnt[names[i]]);}
  tabs.parentNode.insertBefore(bar,tabs.nextSibling);
  tabs.addEventListener('click',function(){setTimeout(apply,0);});
  apply();
})();
</script>

<script id="tj-faq6-js">
(function(){
  var ls=document.querySelectorAll('.tj2 .faq-list');
  for(var i=0;i<ls.length;i++){(function(fl){
    if(fl.classList.contains('m1-few'))return;
    if(fl.parentNode.querySelector('.m1-more'))return;
    if(fl.querySelectorAll('details').length<=6)return;
    if(location.hash){var t=null;try{t=fl.querySelector(location.hash);}catch(e){}if(t)return;}
    fl.classList.add('tj-faq6');
    var b=document.createElement('button');b.type='button';b.className='tj-faq6-more';b.textContent='پرسش‌های بیشتر';
    b.addEventListener('click',function(){fl.classList.remove('tj-faq6');b.remove();});
    fl.parentNode.insertBefore(b,fl.nextSibling);
  })(ls[i]);}
})();
