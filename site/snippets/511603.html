<script id="tj-abroad-m1-js">
(function(){
  if(!/^\/persian-therapy(\/|$)/.test(location.pathname))return;

  if(lang.indexOf('fa')!==0)return;

  var fa=function(x){return String(x).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.charAt(+d);});};
  var lede=copy.querySelector('.lede');
  if(lede){
    lede.classList.add('ab-clamp');
    var more=document.createElement('button');more.type='button';more.className='ab-more';more.textContent='ادامهٔ متن';
    more.addEventListener('click',function(){lede.classList.remove('ab-clamp');more.parentNode.removeChild(more);});
    lede.parentNode.insertBefore(more,lede.nextSibling);
    var mq=window.matchMedia?window.matchMedia('(max-width:700px)'):null;
    var fit=function(){if(!more.parentNode)return;var small=mq?mq.matches:false;more.hidden=!small||lede.scrollHeight<=lede.clientHeight+2;};
    setTimeout(fit,60);window.addEventListener('resize',fit);
  }
  if(root.querySelector('#you')){
    var tz=document.createElement('a');tz.className='ab-tz';tz.href='#you';
    var b=document.createElement('b'),h=document.createElement('em'),c=document.createElement('i'),m=document.createElement('em');

    var s=document.createElement('span');s.textContent='ساعت شما · جلسه با همین ساعت تنظیم می‌شود';
    tz.appendChild(b);tz.appendChild(s);

  }

  }
